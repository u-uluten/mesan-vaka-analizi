. Kaynaklara her slayttaki K düğmesiyle, ayrıntılı anlatıma N düğmesiyle ulaşılabilir.", "sources": ["about", "identity"], "part": "main", "displayNumber": "02"}, {"title": "1991’den bugüne", "sub": "Saha ve trafik güvenliğinde mühendislik", "kind": "timeline", "chapter": "01 · FİRMANIN TARİHÇESİ", "image": "new-hero-poster.jpg", "points": [["1991", "Şirketin kuruluşu"], ["Bugün", "Ar-Ge, entegrasyon ve üretim odağı"], ["2027", "MeDro için açıklanan seri üretim hedefi"]], "note": "MESAN 1991 yılında kuruldu. Şirketin faaliyetleri saha güvenliği, trafik güvenliği ve dedektör eğitim sistemlerini kapsıyor. Ankara Kahramankazan’daki merkez, kamu kurumlarına yönelik mühendislik iş modelinin parçasıdır. Tarihçe değerlendirmemizde, tek ürün tanımından çok birbirini tamamlayan çözüm alanlarına odaklandık. 2027 tarihi, MeDro ürün sayfasındaki ileriye dönük hedeftir; gerçekleşmiş üretim veya teslimat olarak yorumlanmamalıdır.", "sources": ["about", "medro"], "part": "main", "displayNumber": "03"}, {"title": "Faaliyet portföyü", "sub": "Farklı müşteriler, ortak güvenlik ihtiyacı", "kind": "portfolio", "chapter": "ŞİRKETİ TANIMAK", "image": null, "points": [["Saha güvenliği", "MEPAK, MEMAR, MEROB ve MeDro"], ["Eğitim sistemleri", "MERGEN PARKUR ve MERGEN TİM"], ["Trafik güvenliği", "MEDAR hız tespiti ve istatistik çözümleri"]], "note": "İşletme açısından portföyü üç müşteri ihtiyacı çevresinde grupladık: saha risklerinin tespiti, operatörün hazırlanması ve trafik denetimi. Bu gruplama şirketin teknik ürünlerini farklı satın alma amaçlarıyla ilişkilendirir. Saha ürünlerini yalnızca mayın başlığı altında tanımlamak, eğitim ve trafik alanlarını görünmez kılar. Her ürün aynı olgunluk düzeyinde değildir; özellikle MeDro resmî sayfada geliştirme aşamasındadır.", "sources": ["mepak", "memar", "merob", "medro", "parkur", "medar"], "part": "main", "displayNumber": "04"}, {"title": "Misyon ve vizyon", "sub": "İnsan hayatını koruyan, güvenilir bir marka", "kind": "dual", "chapter": "02 · MİSYONU VE VİZYONU", "image": "new-field.jpg", "points": [["Misyon", "Saha ve trafik güvenliğinde değer yaratmak; çalışanı önceleyen, gelişen bir marka olmak."], ["Vizyon", "Özgün ürünlerle ulusal ve uluslararası pazarlarda tercih edilen bir teknoloji şirketi olmak."]], "note": "Resmî misyon ve vizyonu kendi cümlelerimizle özetledik. Misyon şirketin varlık nedenini, vizyon ulaşmak istediği konumu tanımlar. Bizim yorumumuzda rekabet stratejisi, salt donanım satışı yerine güvenilir çözüm ve kullanım yetkinliği çevresinde oluşur. Bu nedenle müşteri eğitimi ve açık ürün iletişimi, misyonun pazarlama uygulamasına dönüşmesinde önemli rol oynar.", "sources": ["identity"], "part": "main", "displayNumber": "05"}, {"title": "Yönetim yapısı", "sub": "İşlevsel uzmanlık ve proje koordinasyonu", "kind": "org", "chapter": "03 · YÖNETİM YAPISI", "image": null, "points": [["Stratejik yönetim", "Portföy, yatırım ve öncelik kararları"], ["Teknik işlevler", "Ar-Ge, mühendislik, üretim ve kalite"], ["Ticari ve destek işlevleri", "Satış, proje takibi, insan kaynakları ve finans"]], "note": "Bu işlev haritası, MESAN’ın açıklanan Ar-Ge, üretim ve entegrasyon faaliyetlerinden çıkardığımız analitik modeldir; doğrulanmış iç organizasyon şeması değildir. Resmî sitede organizasyon şeması başlığı bulunur, ancak erişilen metin kişileri ve raporlama hatlarını doğrulamaya yetmez. İşletme açısından proje yöneticisinin teknik ekip ile müşterinin beklentileri arasında koordinasyon sağlaması gerektiğini değerlendiriyoruz. İsim, unvan ve yetki dağılımı için şirketten güncel şema alınmalıdır.", "sources": ["about", "org"], "caveat": "İşlev haritası: öğrenci değerlendirmesi; resmî organizasyon şeması değildir.", "part": "main", "displayNumber": "06"}, {"title": "Hukuki yapı", "sub": "MESAN Elektronik Sanayi Ticaret A.Ş.", "kind": "split", "chapter": "04 · HUKUKİ YAPISI", "image": "new-factory.jpg", "points": [["Şirket türü", "Kamuya açık kurumsal profillerde anonim şirket unvanı yer alıyor."], ["Faaliyet çerçevesi", "Savunma ve kamu güvenliği tedarikinde belge ve uygunluk yönetimi önem taşıyor."], ["Teyit gerektiren bilgiler", "Sermaye, pay sahipliği ve temsil yetkilerini gösteren sicil belgesi bu çalışmada bulunmuyor."]], "note": "IDEF profili tam ticari unvanı MESAN Elektronik Sanayi Ticaret A.Ş. olarak verir. SAHA EXPO profili tesis güvenliği ve üretim belgelerine ilişkin şirket beyanlarını içerir. Bunları güncel sicil incelemesi veya bağımsız hukuki uygunluk denetimi yerine koymuyoruz. İşletme değerlendirmemiz, belge takibinin teklif ve müşteri güveni üzerindeki önemidir. Ortakların kim olduğu, sermaye tutarı veya yönetim kurulunun yapısı hakkında veri uydurulmamıştır.", "sources": ["idef", "saha"], "part": "main", "displayNumber": "07"}, {"title": "İnsan kaynakları analizi", "sub": "Uzmanlığı korumak, bilgiyi kurumsallaştırmak", "kind": "split", "chapter": "05 · İK ANALİZİ", "image": "new-hero-poster.jpg", "points": [["Yetkinlik ihtiyacı", "RF, elektronik, yazılım ve entegrasyon bilgisi; güncel kariyer sayfasında RF/anten tasarımı örneği."], ["Kurumsal yaklaşım", "İnsan odaklılık ve ayrımcılığa karşı duruş, şirket değerlerinde yer alıyor."], ["Bizim önerimiz", "Mentorluk, proje sonrası bilgi paylaşımı ve ölçülebilir gelişim planları."]], "note": "Kariyer ve değerler sayfaları insan odaklı kültürü ve teknik uzmanlık ihtiyacını destekler. Ancak çalışan sayısı, devir hızı, ücret yapısı, eğitim saati ve memnuniyet puanı erişilebilir kaynaklarla doğrulanmamıştır. Bu nedenle insan kaynakları analizimizi yetkinlik ve bilgi kaybı riski üzerine kurduk. Önerilen göstergeler: kritik pozisyonları doldurma süresi, mentorluk tamamlama oranı ve yetkinlik değerlendirmesi. Bunlar mevcut şirket uygulaması veya sonucu değildir.", "sources": ["career", "values"], "part": "main", "displayNumber": "08"}, {"title": "Makro çevre analizi", "sub": "PESTEL: dış koşulların işletmeye etkisi", "kind": "six", "chapter": "06 · MAKRO ÇEVRE", "image": null, "points": [["Politik", "Kamu alımları ve güvenlik öncelikleri talebi etkileyebilir."], ["Ekonomik", "Kur ve girdi maliyetleri teklif bütçesini zorlayabilir."], ["Sosyal", "Can güvenliği ve güvenilir kurum beklentisi değer yaratır."], ["Teknolojik", "Sensör, insansız platform ve simülasyon alanları fırsat sunar."], ["Çevresel", "Zorlu saha koşulları ve ürün yaşam döngüsü önem kazanır."], ["Hukuki", "İzinler, veri güvenliği ve ürün uygunluğu pazara girişte rol oynar."]], "note": "PESTEL, şirketin kontrolü dışındaki koşulları anlamak için kullandığımız analizdir. Döviz veya maliyet artışı için sayısal tahmin vermiyoruz; riskin teklif ve satın alma süreçlerine nasıl yansıyabileceğini tartışıyoruz. Teknoloji fırsatı MeDro ve MERGEN örnekleriyle somutlaşır. Hukuki boyutta farklı ürün ve ülkelerin kendi gereksinimleri bulunabileceği için koşulsuz uygunluk iddiasında bulunmuyoruz. Çevresel boyut, şirketin çevre politikasının yanında ürünlerin farklı kullanım koşullarını da içerir.", "sources": ["medro", "parkur", "policy"], "caveat": "PESTEL maddeleri öğrenci analizidir; şirketin risk raporu değildir.", "part": "main", "displayNumber": "09"}, {"title": "Mikro çevre analizi", "sub": "Satın alma kararı birden çok aktöre bağlı", "kind": "chain", "chapter": "06 · MİKRO ÇEVRE", "image": null, "points": [["Müşteri", "Kamu kurumları ve uzman kullanıcılar"], ["Tedarikçi", "Kritik bileşen ve teknoloji ortakları"], ["Kanal", "Doğrudan teklif, proje ve yerel iş ortaklığı"], ["Rakip", "Uzmanlaşmış ulusal ve küresel üreticiler"]], "note": "B2G ağırlıklı pazarda son kullanıcı, teknik değerlendirme ekibi ve satın alma birimi farklı beklentiler taşıyabilir. Şirketin kamu müşterileri resmî tanıtımında yer alır; ancak müşteri başına gelir, tedarikçi listesi ve kanal sözleşmeleri açık değildir. Bizim yorumumuz: yüksek teknik açıklama ihtiyacı, demo ve güvenilir referansı önemli hale getirir. Tedarikçi bağımlılığını ve satın alma döngüsü riskini hipotez olarak ele alıyoruz; gerçekleşmiş sorun olarak sunmuyoruz.", "sources": ["about", "idef"], "part": "main", "displayNumber": "10"}, {"title": "SWOT analizi", "sub": "Yetkinliği fırsata dönüştürmenin koşulları", "kind": "matrix", "chapter": "07 · SWOT ANALİZİ", "image": null, "points": [["Güçlü yönler", "Uzun faaliyet geçmişi; saha, eğitim ve trafik portföyü; mühendislik odağı."], ["Gelişime açık yönler", "Karmaşık portföyün anlatımı; uzman bilgisine bağımlılık riski."], ["Fırsatlar", "Etkileşimli demo; yeni kurumsal kullanıcılar; eğitimle birlikte çözüm sunumu."], ["Tehditler", "Küresel uzman rakipler; ihale ve izin süreçleri; teknoloji geliştirme maliyeti."]], "note": "SWOT bir yönetici beyanı değil, kaynakları birlikte okuyarak oluşturduğumuz stratejik değerlendirmedir. Güçlü yönlerin dayanağı kurumsal tarihçe ve ürün çeşitliliğidir. Gelişime açık yönler için şirket içi ölçüm yoktur: dijital anlatım ihtiyacını proje hipotezi olarak ele aldık. Fırsatların gerçekleşmesi, müşteri doğrulaması ve kaynak tahsisine bağlıdır. Tespit ettiğimiz temel eşleşme, mühendislik yetkinliği ile anlaşılır dijital deneyimi bir araya getirme fırsatıdır.", "sources": ["about", "parkur", "medar", "vallon", "jenoptik"], "caveat": "SWOT: kaynaklarla desteklenen öğrenci yorumu.", "part": "main", "displayNumber": "11"}, {"title": "BCG matrisi", "sub": "Portföy kararı için önce pazar verisi gerekir", "kind": "bcg", "chapter": "08 · BCG MATRİSİ", "image": null, "points": [["Yıldızlar", "Yüksek büyüme + yüksek göreli pazar payı"], ["Soru işaretleri", "Yüksek büyüme + düşük göreli pazar payı"], ["Nakit inekleri", "Düşük büyüme + yüksek göreli pazar payı"], ["Düşük pay / düşük büyüme", "Yatırımın gerekçesi ayrıca değerlendirilir"]], "note": "BCG’de göreli pazar payı şirket satışlarının en büyük rakibin satışlarına oranıyla, büyüme ise tanımlanmış pazarın dönemsel değişimiyle değerlendirilir. MESAN için ürün bazında bu veriler bulunmadığından ürünleri kesin biçimde yıldız veya nakit ineği ilan etmiyoruz. MEPAK/MEMAR, MERGEN ve MEDAR ayrı pazarlar için ölçülmelidir. MeDro’nun geliştirme aşamasında olması onu tek başına soru işareti yapmaz. Önerimiz, ürün aileleri için pazar sınırını, satışları, rakip ölçeğini ve nakit ihtiyacını belirleyen portföy veri setidir.", "sources": ["mepak", "parkur", "medar", "medro"], "caveat": "Ürün yerleşimi yapılmadı: büyüme ve göreli pazar payı verileri eksik.", "part": "main", "displayNumber": "12"}, {"title": "Ansoff matrisi", "sub": "Öncelik: mevcut pazarda daha anlaşılır ürün deneyimi", "kind": "matrix", "chapter": "08 · ANSOFF MATRİSİ", "image": null, "points": [["Pazara nüfuz", "Mevcut müşteriler için ürün demosu ve eğitim içeriğini güçlendirmek."], ["Pazar geliştirme", "Mevcut ürünleri yeni ülke ve kurumsal segmentlere uyarlamak."], ["Ürün geliştirme", "Mevcut müşterilerin ihtiyacına yönelik yeni sensör ve platform çözümleri."], ["Çeşitlendirme", "Yeni ürün ve yeni pazara birlikte girişte aşamalı doğrulama."]], "note": "Ansoff büyümeyi mevcut/yeni ürün ile mevcut/yeni pazar eksenlerinde inceler. Öğrenci projemizi öncelikle pazara nüfuz stratejisi içinde konumluyoruz: mevcut ürünlerin anlaşılmasını kolaylaştıran dijital tanıtım, donanım satışının yerini almadan satış öncesi iletişimi destekleyebilir. Yeni ülkeye açılımda dilin yanında servis, satın alma koşulları ve uygunluk gereksinimleri değerlendirilmelidir. MeDro, mevcut müşteri gruplarına yönelik ürün geliştirme örneği olarak tartışılabilir; ticarileşme başarısı varsayılmamıştır.", "sources": ["medro", "project"], "part": "main", "displayNumber": "13"}, {"title": "Hedef pazarlar", "sub": "Segmenti satın alma amacı belirliyor", "kind": "segments", "chapter": "09 · HEDEF PAZARLARI", "image": "memar.png", "points": [["Savunma ve güvenlik", "Silahlı kuvvetler, kolluk ve uzman saha ekipleri"], ["İnsani mayın temizliği", "Kurumsal temizleme ekipleri ve sivil toplum kuruluşları"], ["Trafik ve yol yönetimi", "Emniyet, jandarma trafik, belediyeler ve ilgili kurumlar"], ["Eğitim birimleri", "Operatör hazırlığı ve performans değerlendirmesi"]], "note": "Hedef pazarları resmî ürünlerin kullanım amaçlarından türettik. MEMAR sayfası insani mayın temizliği ve sivil toplum kuruluşlarına açıkça işaret eder. Trafik ve eğitim ürünleri farklı kurumsal ihtiyaçlar taşır. İşletme açısından segmentasyonun ülke listesinden ibaret olmaması gerekir: kullanıcı ihtiyacı, bütçe sahibi, teknik karar verici ve satış sonrası beklenti birlikte tanımlanmalıdır. Doğrulanmış gelir kırılımı veya ülke bazında güncel müşteri listesi verilmemiştir.", "sources": ["memar", "about", "parkur", "medar"], "part": "main", "displayNumber": "14"}, {"title": "Konumlandırma", "sub": "Görev ihtiyacına uygun, güvenilir mühendislik çözümü", "kind": "statement", "chapter": "10 · KONUMLANDIRMASI", "image": "merob.png", "points": ["Hedef müşteri: yüksek güvenilirlik bekleyen kurumsal alıcı", "Farklılaşma zemini: ürün, entegrasyon ve kullanıcı hazırlığı", "Değer önerisi: ihtiyaca uygun çözüm ve anlaşılır teknik destek"], "note": "Önerdiğimiz konumlandırma, şirketin saha ve trafik güvenliği odağını müşteri ihtiyacına bağlar. “En ucuz” veya “en iyi” iddiası için fiyat ve bağımsız performans karşılaştırması bulunmamaktadır. Bu yüzden rekabet üstünlüğünü kesin sonuç olarak değil, uzman mühendislik ve çözüm bütünlüğü üzerinden bir stratejik tercih olarak ele aldık. Marka vaadinin kanıtı güncel ürün belgeleri, gösterimler ve müşteri ihtiyacına uygun doğrulama olmalıdır.", "sources": ["identity", "merob", "parkur"], "part": "main", "displayNumber": "15"}, {"title": "Rakip analizi", "sub": "Her ürün ailesinin rakip kümesi farklı", "kind": "table", "chapter": "11 · RAKİP ANALİZİ", "image": null, "points": [], "note": "Rakiplerin kendi yayımladıkları ürün bilgilerini esas aldık. VALLON VMR3G metal dedektörü ile yer radarını birleştirir. CEIA’nın Ground Search sunumu çoklu sensör çözümlerini tanımlar. Jenoptik mobil ve sabit hız denetimi sistemleri sunar. Bu liste doğrudan aynı ihaleye girdiklerini kanıtlamaz; ilgili ürün alanlarında karşılaştırılabilecek üreticileri gösterir. MESAN lehine pazar payı, fiyat veya teknik üstünlük puanı uydurmadık. Sağlıklı kıyas için eşit test koşulları ve güncel teklifler gerekir.", "sources": ["vallon", "ceia", "jenoptik"], "columns": ["Alan", "Örnek rakip", "Karşılaştırma odağı"], "rows": [["Mayın / EYP tespiti", "VALLON", "Sensör yaklaşımı ve kullanıcı arayüzü"], ["Yer altı arama sistemleri", "CEIA", "Ürün kapsamı ve görev uyumu"], ["Trafik denetimi", "Jenoptik", "Kurulum seçenekleri ve çözüm kapsamı"], ["MESAN için karar", "Ürün bazında kıyas", "Uygunluk, servis ve toplam sahip olma maliyeti"]], "part": "main", "displayNumber": "16"}, {"title": "Pazarlama karması", "sub": "4P: teknik satışa uygun bir bütünlük", "kind": "matrix", "chapter": "12 · PAZARLAMA KARMASI", "image": null, "points": [["Ürün", "Cihazın yanında entegrasyon, eğitim ve destek kapsamını açıklamak."], ["Fiyat", "İlk alım bedeliyle birlikte bakım ve kullanım maliyetini değerlendirmek."], ["Dağıtım", "Doğrudan kurumsal erişim ve proje bazında kanal tasarımı."], ["Tutundurma", "Fuar, teknik içerik, ürün gösterimi ve etkileşimli dijital deneyim."]], "note": "4P çerçevesi, MESAN için önerdiğimiz pazarlama yaklaşımını düzenler. Kamuya açık fiyat listesi ve kanal sözleşmesi bulunmadığından gerçek fiyatlama veya bayi politikası ilan etmiyoruz. Ürün ve teklif iletişiminde toplam sahip olma maliyeti, garanti ve servis kapsamının görünür olması önerilir. IDEF ve SAHA EXPO katılım profilleri fuar kanalını somutlaştırır. Öğrenci projemiz tutundurma içinde, müşterinin ürünü anlamasını destekleyen bir araçtır; teknik kabul testinin yerine geçmez.", "sources": ["idef", "saha", "project"], "part": "main", "displayNumber": "17"}, {"title": "İleriye dönük hedefler", "sub": "Resmî yönelim ve önerilen uygulama planı", "kind": "roadmap", "chapter": "13 · İLERİYE DÖNÜK HEDEFLERİ", "image": "medro-cutout.png", "points": [["Resmî yönelim", "Özgün ürünler ve uluslararası pazarlarda tercih edilirlik."], ["Açıklanan ürün hedefi", "MeDro sayfasında 2027 seri üretim hedefi."], ["Bizim önerimiz", "Önce demo pilotu; ardından içerik ve satış sürecine entegrasyon."]], "note": "Geleceğe ilişkin şirket beyanı ile bizim önerdiğimiz planı ayırıyoruz. Kurumsal vizyon sürdürülebilirlik, özgün ürün ve uluslararası kabulü vurgular. MeDro için belirtilen 2027 hedefi garanti edilmiş teslimat değildir. Dijital demo pilotunun takvimi veya bütçesi şirket tarafından onaylanmış değildir. Önerimiz müşteri geri bildirimi alınan küçük bir pilot, ürün sahiplerinin içerik onayı ve sonrasında sınırlı yaygınlaştırmadır.", "sources": ["identity", "medro"], "caveat": "Pilot ve yaygınlaştırma planı öğrenci önerisidir.", "part": "main", "displayNumber": "18"}, {"title": "Problemin tanımı", "sub": "Karmaşık ürün bilgisi, anlaşılma yükünü artırıyor", "kind": "problem", "chapter": "14 · PROBLEMİN TANIMI", "image": "new-training.jpg", "points": [["Problem hipotezi", "Statik içerik, ürünün kullanım bağlamını ve portföy farklarını anlatmakta sınırlı kalabilir."], ["İşletmeye olası etkisi", "Tekrarlanan açıklama ihtiyacı ve niteliksiz ürün talepleri satış öncesi süreci uzatabilir."], ["Problem kapsamı", "Teknik ürünlerin işlevini ve portföydeki farklarını dijital ortamda anlaşılır biçimde aktarmak."]], "note": "Problemimizi satış öncesi iletişim ve ürün eğitimi ihtiyacı olarak tanımlıyoruz. Bu, şirketin resmî olarak bildirdiği ölçülmüş bir sorun değil; geliştirdiğimiz projenin dayandığı test edilebilir hipotezdir. Kullanıcı röportajı, mevcut web analitiği ve satış ekibinin soru kayıtlarıyla doğrulanmalıdır. Problem “mayın temizliğini oyunla çözmek” değildir. Çözüm önerisinin ayrıntıları, öğretim elemanı talep ederse açılacak ayrı ek bölümde yer alır.", "sources": ["project", "parkur"], "caveat": "Test edilebilir problem hipotezi; şirketin ölçülmüş performans sorunu değildir.", "part": "main", "displayNumber": "19"}, {"title": "Teşekkür ederiz", "sub": "Sorularınız ve değerlendirmeleriniz için", "kind": "closing", "chapter": "KAPANIŞ", "image": "new-factory.jpg", "points": ["MESAN şirket incelemesi ve 14 soruluk vaka analizi", "Utku ULUTEN & Efe BOZKURT", "Başkent Üniversitesi · İŞLE 499"], "note": "Ana sunum, 14. soruda yalnızca problemin tanımını ele alarak tamamlanır. Çözüm önerisi ana akışın dışında, isteğe bağlı ek bölümde bulunur. Öğretim elemanı ayrıntı isterse Çözüm önerimize geç bağlantısıyla bu bölüme geçebiliriz.", "sources": [], "part": "main", "displayNumber": "20"}, {"title": "Kaynaklar ve kapsam", "sub": "Kurumsal bilgiler, rakip kaynakları ve proje kayıtları", "kind": "sources", "chapter": "KAYNAKÇA", "image": null, "points": ["MESAN: kurumsal kimlik, değerler, kariyer ve ürün sayfaları", "IDEF ve SAHA EXPO: şirket profilleri", "VALLON, CEIA ve Jenoptik: üretici açıklamaları", "Öğrenci projesi: 3D merkez, kaynak dosyaları ve ekran görüntüleri"], "note": "Kaynaklara 11 Kasım 2026 tarihinde erişildi. Üretici ürün bilgileri üretici beyanıdır; bağımsız karşılaştırma testi değildir. Güncel sicil ve iç işletme verileri bu dosyanın kapsamı dışındadır. SWOT, PESTEL, Ansoff, konumlandırma ve pazarlama karması öğrenci değerlendirmeleridir. BCG için gerekli nicel veri bulunmadığı açıkça belirtilmiştir. Görseller MESAN’ın resmî ürün/film kaynaklarından ve kendi öğrenci projemizden gelir. Bu çalışma şirket tarafından onaylanmış bir kurumsal sunum değildir.", "sources": ["about", "identity", "values", "career", "org", "policy", "idef", "saha", "mepak", "memar", "medro", "merob", "parkur", "medar", "vallon", "ceia", "jenoptik", "project", "field"], "part": "main", "displayNumber": "21"}, {"title": "Geliştirdiğimiz çözüm", "sub": "3D öğrenme ve ürün keşif merkezi", "kind": "project", "chapter": "EK 01 · ÇÖZÜM ÖNERİMİZ", "image": "campus.jpg", "points": [["8", "Etkileşimli öğrenme senaryosu"], ["4", "Dil: Türkçe, İngilizce, Almanca, Arapça"], ["10", "Serbest kampüste keşif bölgesi"]], "note": "Önceki çalışmamızda geliştirdiğimiz web uygulaması sekiz senaryo içerir: saha algılama, kara robotları, havadan inceleme, operatör koordinasyonu, trafik, koruyucu ekipman, çevresel programlar ve sistem mühendisliği. Serbest saha on keşif noktalı kavramsal bir kampüstür. Görüntü gerçek MESAN tesisinin fotoğrafı değil, projemizin ekran görüntüsüdür. Ürün referansları resmî kaynaklara bağlıdır; sahne geometrileri ve puanları öğretici ve temsili niteliktedir.", "sources": ["project", "field"], "caveat": "Bağımsız öğrenci projesi; gerçek tesis veya sertifikalı operasyon simülatörü değildir.", "part": "appendix", "displayNumber": "01"}, {"title": "Uygulamanın işletme değeri", "sub": "Keşfetme, karşılaştırma ve açıklama", "kind": "projectFlow", "chapter": "EK 02 · UYGULAMANIN İŞLETME DEĞERİ", "image": "simulation.jpg", "points": [["Ziyaretçi", "Senaryo seçer, görevi dener, ürün referansını inceler."], ["Satış öncesi süreç", "Daha somut ihtiyaç konuşmasına ve ortak bir kavram diline zemin oluşturabilir."], ["Öğrenme", "Geri bildirim ve rapor, deneyimin değerlendirilmesini sağlar."]], "note": "Proje, pasif katalog tüketimine etkileşimli bir seçenek ekler. İşletme değerini henüz ölçülmüş satış artışı olarak sunmuyoruz. Uygulamadaki arşiv ve oturumlar tarayıcının yerel belleğinde saklanır; şirketin CRM sistemine otomatik veri akışı bulunmaz. Resmî MERGEN PARKUR ürünü ile öğrenci uygulamamız ayrı çalışmalardır. Projemiz kullanıcıyı bu ürünlere yönlendiren kavramsal bir anlatım ve öğrenme ortamıdır.", "sources": ["project", "parkur"], "part": "appendix", "displayNumber": "02"}, {"title": "Başarıyı nasıl ölçeceğiz?", "sub": "Kullanıcı testiyle doğrulanacak bir pilot", "kind": "table", "chapter": "EK 03 · DEĞERLENDİRME PLANI", "image": null, "points": [], "note": "Önerilen pilotta benzer profilde ziyaretçilere katalog ve etkileşimli deneyim karşılaştırmalı olarak sunulabilir. Aynı sorular ve eşit süreyle ürün eşleştirme doğruluğu, görev tamamlama ve kullanıcı yorumları incelenmelidir. Örneklem ve hedef eşikleri ilk ölçümden sonra belirlenmelidir; bugün için yüzde veya yatırım geri dönüşü hedefi uydurmuyoruz. Yerel uygulama kayıtları ticari sonuç kanıtı değildir. Kişisel veri toplanacaksa kapsam ve izinler ayrıca tasarlanmalıdır.", "sources": ["project"], "columns": ["Ölçüt", "Ölçüm yöntemi", "Beklenen yön"], "rows": [["Ürün ailesini doğru seçme", "Ön test / son test", "Doğru cevap oranı artsın"], ["Bilgiyi anlama", "Kısa kavram soruları", "Kavram karışıklığı azalsın"], ["Kullanılabilirlik", "Görev tamamlama ve görüşme", "Takılma noktaları azalsın"], ["Talep niteliği", "Satış ekibi değerlendirmesi", "İhtiyaç daha açık tanımlansın"]], "caveat": "Bu tablo bir ölçüm önerisidir; pilot sonuçları henüz bulunmuyor.", "part": "appendix", "displayNumber": "03"}], "assets": {"new-training.jpg": "assets/new-training.webp", "mepak.png": "assets/mepak.webp", "merob.png": "assets/merob.webp", "simulation.jpg": "assets/simulation.webp", "new-factory.jpg": "assets/new-factory.webp", "medro-cutout.png": "assets/medro-cutout.webp", "campus.jpg": "assets/campus.webp", "mergen-tim-1.png": "assets/mergen-tim-1.webp", "new-field.jpg": "assets/new-field.webp", "field.jpg": "assets/field.webp", "medar.png": "assets/medar.webp", "logo.png": "assets/logo.webp", "new-test-field.jpg": "assets/new-test-field.webp", "new-hero-poster.jpg": "assets/new-hero-poster.webp", "mergen-parkur-3.png": "assets/mergen-parkur-3.webp", "new-traffic.jpg": "assets/new-traffic.webp", "memar.png": "assets/memar.webp"}}</script><script>

function go(n){const [lo,hi]=bounds(),old=index;index=Math.max(lo,Math.min(hi,n));slides.forEach((e,j)=>{e.classList.toggle('active',j===index);e.inert=j!==index;e.setAttribute('aria-hidden',j!==index);e.classList.toggle('exiting',j===old&&j!==index)});const local=index-lo,total=hi-lo+1;$('#counter').textContent=(activePart==='appendix'?'Ek ':'Ana ')+String(local+1).padStart(2,'0')+' / '+total;$('#progress span').style.width=((local+1)/total*100)+'%';$('#progress').setAttribute('aria-valuenow',local+1);$('#progress').setAttribute('aria-valuemax',total);$('#progress').setAttribute('aria-label',activePart==='appendix'?'Ek bölüm slaytı seç':'Ana sunum slaytı seç');$('#prev').disabled=index===lo;$('#next').disabled=index===hi;$('#next').setAttribute('aria-label',index===hi?(activePart==='appendix'?'Ek bölüm tamamlandı':'Ana sunum tamamlandı'):'Sonraki slayt');$('#returnMain').hidden=activePart==='main';document.body.classList.toggle('appendix-mode',activePart==='appendix');history.replaceState(null,'','#'+(activePart==='appendix'?'solution/'+local:'main/'+index));if($('#drawer').classList.contains('open')&&mode==='notes')panel('notes');}
function openSolution(){if(activePart==='main')mainReturn=index;activePart='appendix';go(MAIN);closeDrawer();$('#returnMain').focus();}
function returnMain(){activePart='main';go(mainReturn);closeDrawer();$('#stage .active [data-open-solution]')?.focus();}
{const initial=route();activePart=initial.part;go(initial.index);}
addEventListener('hashchange',()=>{const r=route();activePart=r.part;go(r.index);});
function closeDrawer(){$('#drawer').classList.remove('open');lastFocus?.focus();}
function panel(type){lastFocus=document.activeElement;mode=type;const s=D.slides[index],[lo,hi]=bounds();$('#drawerTitle').textContent=type==='notes'?s.title:type==='menu'?(activePart==='appendix'?'Ek bölüm · Çözüm önerimiz':'Ana sunum · 14 soruluk vaka analizi'):'Kaynaklar ve kanıt';$('#drawerBody').innerHTML=type==='notes'?'<p>'+esc(s.note)+'</p><div class="sourceLinks">'+s.sources.map(k=>link(D.sources[k])).join('')+'</div>':type==='menu'?'<div class="menuGrid">'+D.slides.slice(lo,hi+1).map((p,j)=>'<button data-jump="'+(lo+j)+'"><small>'+esc(p.displayNumber)+' · '+esc(p.chapter)+'</small>'+esc(p.title)+'</button>').join('')+(activePart==='main'?'<button class="menuBranch" data-open-solution><small>İSTEĞE BAĞLI EK BÖLÜM</small>Çözüm önerimize geç ↗</button>':'<button class="menuBranch" data-return-main>Ana sunuma dön ↩</button>')+'</div>':'<p>'+esc(s.caveat||'Kurumsal kaynaklar ve öğrenci yorumları slaytın konuşmacı notlarında açıklanmıştır.')+'</p><div class="sourceLinks">'+s.sources.map(k=>link(D.sources[k])).join('')+'</div><p style="font-size:14px">Erişim: 11 Kasım 2026. Resmî görseller: MESAN. Kampüs ve uygulama görselleri: öğrenci projesi.</p>';$('#drawer').classList.add('open');$('#closeDrawer').focus();}
function link(p){return '<a href="'+p.url+'" target="_blank" rel="noopener">'+esc(p.title)+' ↗<small>'+esc(p.url)+'</small></a>';}
$('#menuBtn').onclick=()=>panel('menu');$('#notesBtn').onclick=()=>panel('notes');$('#sourcesBtn').onclick=()=>panel('sources');$('#closeDrawer').onclick=closeDrawer;$('#returnMain').onclick=returnMain;
$('#drawer').onclick=e=>{if(e.target===$('#drawer'))closeDrawer();const b=e.target.closest('[data-jump]');if(b){go(+b.dataset.jump);closeDrawer();}};
$('#next').onclick=()=>go(index+1);$('#prev').onclick=()=>go(index-1);$('#progress').onclick=e=>{const [lo,hi]=bounds();go(lo+Math.floor((e.clientX-e.currentTarget.getBoundingClientRect().left)/e.currentTarget.clientWidth*(hi-lo+1)));};$('#progress').onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();go(index+(e.key==='ArrowRight'?1:-1));}};
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500);}async function fullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch{toast('Tarayıcınızın tam ekran seçeneğini kullanın.');}}$('#fsBtn').onclick=fullscreen;$('#motionBtn').onclick=()=>{motion=!motion;document.body.classList.toggle('motion-off',!motion);$('#motionBtn').textContent='Hareket: '+(motion?'açık':'kapalı');};
document.addEventListener('click',e=>{if(e.target.closest('[data-open-solution]'))openSolution();if(e.target.closest('[data-return-main]'))returnMain();let b=e.target.closest('[data-demo]');if(b){let url=D.meta.simulation+b.dataset.demo;$('#demoLink').href=url;$('#demoFrame').src=url;$('#demo').classList.add('open');$('#closeDemo').focus();}if(e.target.closest('[data-film]')){$('#video').src=D.film||'assets/mesan.mp4';$('#filmModal').classList.add('open');$('#video').play().catch(()=>{});$('#closeFilm').focus();}});function closeDemo(){$('#demo').classList.remove('open');$('#demoFrame').src='about:blank';$('#stage .active [data-demo]')?.focus();}function closeFilm(){$('#video').pause();$('#filmModal').classList.remove('open');$('#stage .active [data-film]')?.focus();}$('#closeDemo').onclick=closeDemo;$('#closeFilm').onclick=closeFilm;
addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeDemo();closeFilm();return;}let overlay=$('.drawer.open,.modal.open');if(e.key==='Tab'&&overlay){const focusable=[...overlay.querySelectorAll('button,a[href],iframe,video')].filter(x=>x.getClientRects().length),first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}return;}if(overlay||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(index-1)}if(e.key==='Home')go(bounds()[0]);if(e.key==='End')go(bounds()[1]);if(e.key.toLowerCase()==='m')panel('menu');if(e.key.toLowerCase()==='n')panel('notes');if(e.key.toLowerCase()==='k')panel('sources');if(e.key.toLowerCase()==='f')fullscreen();if(e.key.toLowerCase()==='a')$('#motionBtn').click();});let sx=0,sy=0;$('#viewport').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});$('#viewport').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4)go(index+(dx<0?1:-1));},{passive:true});
window.deck={go,openSolution,returnMain,get index(){return index},get part(){return activePart},data:D};
